<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noah Protein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --panel:#141414;
    --panel-2:#1a1a1a;
    --line:#2a2a2a;
    --ink:#f5f3ee;
    --muted:#9a968d;
    --accent:#c9a84a;
    --pill:#e9e6df;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  .display{font-family:'Fraunces',Georgia,serif}

  /* announcement bar */
  .announce{
    border-bottom:1px solid var(--line);
    text-align:center;
    font-size:13px;
    letter-spacing:.01em;
    padding:11px 16px;
    color:var(--ink);
  }
  .announce a{text-decoration:underline;text-underline-offset:3px}

  /* nav */
  nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 40px;
    border-bottom:1px solid var(--line);
  }
  .nav-left{display:flex;align-items:center;gap:40px}
  .hamburger{display:none;flex-direction:column;justify-content:center;gap:5px;width:26px;height:20px;background:none;border:none;cursor:pointer;padding:0}
  .hamburger span{display:block;width:100%;height:2px;background:var(--ink);border-radius:2px}
  .brand{font-family:'Fraunces',serif;font-size:30px;font-weight:500;letter-spacing:.02em}
  .brand sup{font-size:11px;top:-1em}
  .nav-links{display:flex;gap:30px;font-size:15px}
  .nav-links a{color:var(--ink);opacity:.9;transition:opacity .2s}
  .nav-links a:hover{opacity:1}
  .nav-right{display:flex;align-items:center;gap:26px;font-size:15px;color:#fff}
  .nav-right a{transition:color .2s}
  .nav-right a:hover{color:var(--ink)}
  .cart{
    background:var(--pill);color:#111;border-radius:999px;
    padding:9px 20px;font-weight:500;font-size:14px;
  }

  /* hero */
  .hero{
    position:relative;
    min-height:78vh;
    display:flex;align-items:center;justify-content:center;
    padding:80px 40px;
    overflow:hidden;
    background:#060606;
  }
  .hero-video{
    position:absolute;inset:0;z-index:0;
    width:100%;height:100%;object-fit:cover;
  }
  .hero-overlay{
    position:absolute;inset:0;z-index:1;
    background:
      linear-gradient(90deg, rgba(6,6,6,.75) 0%, rgba(6,6,6,.51) 45%, rgba(6,6,6,.17) 100%),
      radial-gradient(120% 90% at 78% 60%, rgba(36,27,10,.30) 0%, rgba(18,13,5,.38) 40%, rgba(6,6,6,.51) 75%);
  }
  .hero-copy{position:relative;z-index:2;max-width:820px;text-align:center}
  .hero h1{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-style:italic;
    font-weight:400;
    font-size:clamp(42px,6.4vw,92px);
    line-height:1.08;
    letter-spacing:.005em;
  }
  .hero h1{color:#fff}
  .hero h1 em{font-style:italic;font-weight:300;color:#fff}
  .hero .sub{margin-top:26px;color:var(--muted);font-size:18px}
  .hero-cta{display:flex;gap:16px;margin-top:38px;flex-wrap:wrap;justify-content:center}
  .btn{
    border-radius:999px;padding:15px 34px;font-size:15px;font-weight:500;
    cursor:pointer;transition:transform .15s,background .2s,color .2s;border:1px solid transparent;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn-solid{background:var(--pill);color:#111}
  .btn-outline{background:transparent;color:var(--ink);border-color:#4a463d}
  .btn-outline:hover{background:rgba(255,255,255,.06)}

  /* section header */
  .shop{padding:74px 40px 90px}
  .shop-head{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:24px;margin-bottom:40px;flex-wrap:wrap;
  }
  .shop-head h2{
    font-family:'Fraunces',serif;font-weight:400;
    font-size:clamp(30px,4vw,46px);line-height:1;
  }
  .eyebrow{
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);margin-bottom:14px;
  }
  .shop-head p{color:var(--muted);max-width:340px;font-size:15px}

  /* grid */
  .grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:20px;
  }
  @media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:620px){.grid{grid-template-columns:1fr}}

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;position:relative;overflow:hidden;
    transition:border-color .25s,transform .25s;
    display:flex;flex-direction:column;
  }
  .card:hover{border-color:#3d3a32;transform:translateY(-4px)}
  .art{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:36px 8px 26px;min-height:200px;
  }
  .wrapper-img{max-width:90%;max-height:100%;object-fit:contain}
  .unwrap{
    position:relative;width:90%;height:100%;max-height:220px;
    transition:transform .45s cubic-bezier(.22,.9,.32,1);
    transform-origin:65% 100%;
  }
  .unwrap:hover{transform:rotate(-30deg) translateY(-8px)}
  .unwrap img{
    position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;object-fit:contain;
  }
  .unwrap-raw{opacity:1}
  .unwrap-wrapped{
    opacity:1;
    clip-path:inset(0 0 0 0);
    transition:clip-path .45s cubic-bezier(.22,.9,.32,1);
  }
  .unwrap:hover .unwrap-wrapped{clip-path:inset(0 35% 0 0)}
  .bar{
    width:80%;max-width:260px;height:96px;border-radius:8px;position:relative;
    transform:rotate(-8deg);
    box-shadow:0 16px 30px rgba(0,0,0,.45);
    display:flex;align-items:center;
  }
  .bar .logo{
    font-family:'Fraunces',serif;font-size:30px;color:#161208;
    padding-left:20px;letter-spacing:.01em;
  }
  .bar .logo sup{font-size:9px}
  .bar .label{
    position:absolute;right:10px;top:12px;bottom:12px;width:64px;
    background:#2b6bb0;border-radius:4px;color:#fff;font-size:8px;
    padding:7px;line-height:1.25;font-weight:600;
  }
  .bar .stats{
    position:absolute;left:20px;bottom:12px;font-size:8px;color:#3a2f12;
    font-weight:600;letter-spacing:.02em;
  }
  /* wrapper colorways */
  .w-gold{background:linear-gradient(135deg,#e7cf7f,#c9a84a 55%,#a9852f)}
  .w-bronze{background:linear-gradient(135deg,#d59a6a,#b3703f 55%,#8a5228)}
  .w-cocoa{background:linear-gradient(135deg,#8a6b52,#5f4632 55%,#3f2d1f)}
  .w-plum{background:linear-gradient(135deg,#caa5c4,#9a6e93 55%,#6e4a68)}
  .w-mint{background:linear-gradient(135deg,#bcd9c0,#87b58e 55%,#5c8a63)}
  .w-berry{background:linear-gradient(135deg,#d8a0a8,#b06974 55%,#8a4551)}
  .label.plum{background:#7a4d86}
  .label.mint{background:#4f8f63}
  .label.berry{background:#a34659}
  .label.cocoa{background:#5a3f2c}

  .card-foot{border-top:1px solid var(--line);padding-top:18px;margin-top:6px}
  .flavor{font-family:'Fraunces',serif;font-size:21px;font-weight:500;margin-bottom:6px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .price{color:var(--muted);font-size:14px}
  .desc{color:var(--muted);font-size:14px;margin:2px 0 10px}
  .actions{display:flex;gap:10px}
  .icon-btn{
    width:40px;height:40px;border-radius:999px;border:1px solid var(--line);
    background:transparent;color:var(--ink);cursor:pointer;font-size:16px;
    display:flex;align-items:center;justify-content:center;transition:background .2s,transform .15s;
  }
  .icon-btn.add{background:var(--pill);color:#111;border-color:var(--pill)}
  .icon-btn:hover{transform:scale(1.06)}

  footer{border-top:1px solid var(--line);padding:40px;text-align:center;color:var(--muted);font-size:13px}
  @media(max-width:640px){
    nav{padding:16px 20px;position:relative}
    .hamburger{display:flex}
    .nav-links{
      display:none;position:absolute;top:100%;left:0;width:100%;
      flex-direction:column;background:var(--panel);border-bottom:1px solid var(--line);
      padding:18px 20px;gap:18px;z-index:20;
    }
    nav.nav-open .nav-links{display:flex}
    .nav-right a:not(.cart){display:none}
    .hero,.shop{padding-left:20px;padding-right:20px}
  }
</style>
</head>
<body>

  <div class="announce"><a href="#">3rd party tested for protein content and purity.</a></div>

  <nav id="siteNav">
    <div class="nav-left">
      <button class="hamburger" id="menuToggle" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="brand">Noah<sup>™</sup></div>
      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#shop">Shop</a>
        <a href="#">Bundle</a>
      </div>
    </div>
    <div class="nav-right">
      <a href="#">Store locator</a>
      <a href="#" class="cart">Cart&nbsp;&nbsp;0</a>
    </div>
  </nav>
  <script>
    document.getElementById('menuToggle').addEventListener('click', () => {
      const nav = document.getElementById('siteNav');
      const open = nav.classList.toggle('nav-open');
      document.getElementById('menuToggle').setAttribute('aria-expanded', open);
    });
  </script>

  <!-- HERO -->
  <header class="hero">
    <video class="hero-video" autoplay muted loop playsinline>
      <source src="Bar%20Animations%20/hero%20video.mp4" type="video/mp4">
    </video>
    <div class="hero-overlay"></div>
    <div class="hero-copy">
      <h1>Trying is human.<br><em>Perfection is Noah.</em></h1>
      <p class="sub">Noah doesn't try. It just delivers.</p>
      <div class="hero-cta">
        <a href="#shop" class="btn btn-solid">Shop</a>
        <a href="#" class="btn btn-outline">Build bundles</a>
      </div>
    </div>
  </header>

  <!-- SHOP -->
  <section class="shop" id="shop">
    <div class="shop-head">
      <div>
        <div class="eyebrow">The lineup</div>
        <h2>Shop high-protein bars</h2>
      </div>
      <p></p>
    </div>

    <div class="grid" id="grid"></div>
  </section>

  <footer>Noah™ — the optimal protein for your optimal form.</footer>

<script>
  const bars = [
    {flavor:"Chocolate Chip Cookie Dough", price:"$39.00 | 12 bars", tags:[{t:"Gold",c:"dark"}], desc:"", wrap:"w-gold", label:"", labeltxt:"Chocolate Chip Cookie Dough", img:"Bars/cookie%20dough%20no%20bg%20.png", rawImg:"Bars/raw%20normal%20bar%20.png", barColor:"#e3c39a"},
    {flavor:"Red Velvet", price:"$39.00 | 12 bars", tags:[{t:"New",c:"new"}], desc:"Velvety cocoa crumb with a cream-cheese swirl.", wrap:"w-berry", label:"berry", labeltxt:"Red Velvet Flavored Bar", img:"Bars/red%20velvet%20no%20bg.png", barColor:"#a5293f"},
    {flavor:"Peanut Butter Chocolate Chunk", price:"$39.00 | 12 bars", tags:[{t:"28g Protein",c:"dark"},{t:"0g Sugar",c:"dark"}], desc:"Sweet-salty peanut dough with rich chocolate.", wrap:"w-gold", label:"", labeltxt:"Peanut Butter Chocolate Chunk", img:"Bars/peanut%20no%20bg.png", rawImg:"Bars/raw%20normal%20bar%20peanut.png", barColor:"#dfba8c"},
    {flavor:"Blueberry Pie", price:"$39.00 | 12 bars", tags:[{t:"Back in stock",c:""}], desc:"Bright berry with a buttery crust note.", wrap:"w-plum", label:"plum", labeltxt:"Blueberry Pie Flavored Bar", img:"Bars/bluebery%20no%20bg.png", barColor:"#7c5a95"},
    {flavor:"Mint Chocolate Chip", price:"$39.00 | 12 bars", tags:[{t:"New",c:"new"}], desc:"Cool mint studded with dark chocolate.", wrap:"w-mint", label:"mint", labeltxt:"Mint Chocolate Chip Flavored Bar", img:"Bars/mint%20no%20bg.png", barColor:"#5e9e6a"},
    {flavor:"Double Chocolate", price:"$39.00 | 12 bars", tags:[{t:"150 Calories",c:"dark"}], desc:"Deep cocoa, fudge-forward and dense.", wrap:"w-cocoa", label:"cocoa", labeltxt:"Double Chocolate Flavored Bar", barColor:"#6b4a30"},
  ];

  const grid = document.getElementById('grid');
  grid.innerHTML = bars.map(b => `
    <article class="card">
      <div class="art">
        ${b.rawImg ? `
        <div class="unwrap">
          <img class="unwrap-raw" src="${b.rawImg}" alt="${b.flavor} unwrapped">
          <img class="unwrap-wrapped" src="${b.img}" alt="${b.flavor}">
        </div>` : b.img ? `<img class="wrapper-img" src="${b.img}" alt="${b.flavor}">` : `
        <div class="bar ${b.wrap}">
          <span class="logo">Noah<sup>™</sup></span>
          <span class="label ${b.label}">${b.labeltxt}</span>
          <span class="stats">28g Protein | 150 Cal | 0g Sugar</span>
        </div>`}
      </div>
      <div class="card-foot">
        <div class="flavor">${b.flavor}</div>
        ${b.desc ? `<p class="desc">${b.desc}</p>` : ''}
        <div class="row">
          <span class="price">${b.price}</span>
          <div class="actions">
            <button class="icon-btn" aria-label="Quick view">&#128065;</button>
            <button class="icon-btn add" aria-label="Add to cart">+</button>
          </div>
        </div>
      </div>
    </article>
  `).join('');
</script>
</body>
</html>
